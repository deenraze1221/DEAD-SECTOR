[workspace]
resolver = "3"
members = ["crates/ds-assets", "crates/ds-render", "crates/ds-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[profile.dev]
opt-level = 1

# Parsing the 31 MB city.json is painfully slow without optimised dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
