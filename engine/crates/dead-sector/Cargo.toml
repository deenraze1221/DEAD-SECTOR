[package]
name = "dead-sector"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
sector-assets = { version = "0.1.0", path = "../sector-assets" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sector-physics = { version = "0.1.0", path = "../sector-physics" }
sector-render = { version = "0.1.0", path = "../sector-render" }
env_logger = "0.11.11"
glam = "0.34.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.34"
wgpu = "30.0.1"
winit = "0.30.13"

[[bin]]
name = "dead-sector"
path = "src/main.rs"

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
